
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DR. JIBA | Sistema de Gestión</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f4f6;
      color: #1f2937;
    }

    header {
      background: #7f1d1d;
      color: white;
      padding: 22px;
      text-align: center;
    }

    header h1 { margin: 0 0 8px; }

    nav {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px;
      background: #991b1b;
      padding: 14px;
    }

    nav button, .boton {
      background: white;
      border: none;
      border-radius: 6px;
      padding: 12px 18px;
      cursor: pointer;
      font-weight: bold;
      color: #7f1d1d;
    }

    nav button:hover { background: #fee2e2; }

    main {
      max-width: 1100px;
      margin: 30px auto;
      padding: 0 20px;
    }

    .panel {
      background: white;
      border-radius: 12px;
      padding: 25px;
      box-shadow: 0 2px 8px #00000012;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 18px;
      margin-top: 20px;
    }

    .card {
      padding: 25px;
      background: #fef2f2;
      border-left: 5px solid #991b1b;
      border-radius: 8px;
    }

    .card h3 { margin-top: 0; }

    .card p {
      font-size: 25px;
      font-weight: bold;
      margin-bottom: 0;
    }

    .tabla-contenedor {
      width: 100%;
      overflow-x: auto;
      margin-top: 20px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th {
      background: #991b1b;
      color: white;
      text-align: left;
      padding: 14px;
    }

    td {
      padding: 13px;
      border-bottom: 1px solid #e5e7eb;
    }

    tr:nth-child(even) { background: #f9fafb; }

    .stock-bajo {
      color: #b91c1c;
      font-weight: bold;
    }

    .mensaje {
      padding: 15px;
      border-radius: 8px;
      background: #fef2f2;
      margin-top: 15px;
    }

    .login {
      max-width: 420px;
      margin: 45px auto;
    }

    .login h2 {
      text-align: center;
      color: #7f1d1d;
    }

    .login label {
      display: block;
      margin-top: 18px;
      font-weight: bold;
    }

    .login input {
      width: 100%;
      padding: 12px;
      margin-top: 7px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      font-size: 15px;
    }

    .login button {
      width: 100%;
      background: #991b1b;
      color: white;
      padding: 13px;
      margin-top: 22px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }

    .login button:disabled {
      opacity: .6;
      cursor: wait;
    }

    .error {
      color: #b91c1c;
      margin-top: 15px;
      text-align: center;
    }

    .usuario {
      background: #fff7f7;
      padding: 12px 18px;
      border-radius: 8px;
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    .usuario button {
      background: #991b1b;
      color: white;
      border: none;
      padding: 10px 14px;
      border-radius: 6px;
      cursor: pointer;
    }

    .resumen {
      margin-top: 0;
      margin-bottom: 22px;
    }

    .resumen .card p { font-size: 22px; }

    .productos-layout {
      display: grid;
      grid-template-columns: minmax(0, 3fr) minmax(280px, 2fr);
      gap: 22px;
      align-items: start;
    }

    .productos-layout > * { min-width: 0; }

    .productos-herramientas {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .productos-herramientas input,
    .productos-herramientas select {
      padding: 10px 12px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      font-size: 15px;
      background: white;
    }

    .productos-herramientas input { flex: 1 1 200px; }

    .productos-contador {
      color: #6b7280;
      font-size: 14px;
      margin: 10px 0 0;
    }

    #tablaProductos tbody tr[data-id] { cursor: pointer; }

    #tablaProductos tbody tr[data-id]:hover,
    #tablaProductos tbody tr[data-id]:focus {
      background: #fee2e2;
      outline: none;
    }

    #tablaProductos tbody tr.seleccionado {
      background: #fecaca;
      box-shadow: inset 4px 0 0 #991b1b;
    }

    .etiqueta {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: bold;
      white-space: nowrap;
    }

    .etiqueta-agotado { background: #fee2e2; color: #b91c1c; }
    .etiqueta-bajo { background: #fef3c7; color: #b45309; }
    .etiqueta-disponible { background: #dcfce7; color: #15803d; }

    .visor3d-panel {
      background: linear-gradient(180deg, #fff7f7, #fde8e8);
      border: 1px solid #fecaca;
      border-radius: 12px;
      padding: 16px;
      position: sticky;
      top: 20px;
    }

    .visor3d-panel h3 {
      margin: 0 0 10px;
      color: #7f1d1d;
    }

    .visor3d {
      width: 100%;
      height: 340px;
      border-radius: 10px;
      overflow: hidden;
      background: radial-gradient(circle at 50% 35%, #ffffff, #fde2e2);
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: none;
    }

    .visor3d canvas {
      display: block;
      width: 100%;
      height: 100%;
      cursor: grab;
    }

    .visor3d canvas:active { cursor: grabbing; }

    .visor3d canvas:focus-visible { outline: 3px solid #991b1b; }

    .visor3d-fallback {
      padding: 20px;
      text-align: center;
      color: #6b7280;
    }

    .visor3d-ayuda {
      font-size: 13px;
      color: #6b7280;
      margin: 10px 0 0;
      text-align: center;
    }

    @media (max-width: 820px) {
      .productos-layout { grid-template-columns: minmax(0, 1fr); }
      .visor3d-panel { position: static; order: -1; }
      .visor3d { height: 280px; }
    }


    /* Modulo de compras */
    .compras-formulario { display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:14px; margin:18px 0; }
    .compras-campo label { display:block; font-weight:bold; margin-bottom:7px; }
    .compras-campo input, .compras-campo select { width:100%; padding:11px; border:1px solid #d1d5db; border-radius:6px; background:white; }
    .compras-acciones { display:flex; gap:10px; flex-wrap:wrap; margin:16px 0; }
    .compras-acciones button { border:0; border-radius:6px; padding:12px 16px; background:#991b1b; color:white; font-weight:bold; cursor:pointer; }
    .compras-acciones button:disabled { opacity:.5; cursor:not-allowed; }
    .compras-total { text-align:right; font-size:22px; font-weight:bold; color:#7f1d1d; }
    .compras-aviso { padding:12px; background:#fff7ed; border-left:4px solid #d97706; border-radius:6px; margin:15px 0; }

    footer {
      text-align: center;
      padding: 25px;
      color: #6b7280;
    }

    [hidden] { display: none !important; }
  
/* ==========================================================
   DR. JIBA | Diseño Dashboard Azul Marino
   Capa visual: conserva IDs, funciones, endpoints y visor 3D.
   ========================================================== */
:root {
  --navy:#0b1933; --navy2:#12284b; --blue:#2563eb;
  --cyan:#38bdf8; --ink:#14233d; --muted:#687891;
  --surface:#ffffff; --line:#e5ebf4; --page:#f3f6fb;
}
html { scroll-behavior:smooth; }
body { background:var(--page); color:var(--ink); font-family:Inter,"Segoe UI",Arial,sans-serif; min-height:100vh; }
header {
  position:fixed; top:0; left:0; z-index:50; width:248px; height:104px;
  background:var(--navy); text-align:left; padding:27px 23px 15px;
  border-bottom:1px solid #ffffff1a;
}
header h1 {font-size:26px; font-weight:850; letter-spacing:.8px; margin:0 0 7px;}
header h1::before {content:"◈"; color:var(--cyan); margin-right:10px;}
header p {font-size:11px; line-height:1.5; color:#9db4d6; margin:0; letter-spacing:.15px;}
nav#menu {
  position:fixed; left:0; top:104px; bottom:0; width:248px; z-index:49;
  display:flex; flex-direction:column; align-items:stretch; justify-content:flex-start;
  flex-wrap:nowrap; gap:7px; background:var(--navy); padding:25px 14px;
  box-shadow:8px 0 25px #0b193310; overflow-y:auto;
}
nav#menu::before {content:"NAVEGACIÓN"; color:#7690b4; font-size:10px; letter-spacing:2px; padding:0 15px 10px; font-weight:800;}
nav#menu button {
  display:flex; align-items:center; text-align:left; width:100%;
  border-radius:11px; padding:15px 16px; background:transparent;
  color:#b8c9e4; font-size:14px; font-weight:650;
  transition:background .2s, color .2s, transform .2s;
}
nav#menu button:nth-of-type(1)::before {content:"⌂";}
nav#menu button:nth-of-type(2)::before {content:"▦";}
nav#menu button:nth-of-type(3)::before {content:"↧";}
nav#menu button:nth-of-type(4)::before {content:"↗";}
nav#menu button:nth-of-type(5)::before {content:"▤";}
nav#menu button::before {font-size:20px; margin-right:15px; min-width:24px; text-align:center; color:#78bdf7;}
nav#menu button:hover {background:#ffffff13; color:white; transform:translateX(3px);}
nav#menu button.activo {background:linear-gradient(100deg,#2563eb,#1b4fb0); color:white; box-shadow:0 8px 20px #020b2480;}
nav#menu button.activo::before {color:white;}
main {max-width:none; margin:0 0 0 248px; padding:35px clamp(22px,3.5vw,56px) 60px; min-height:calc(100vh - 65px);}
body:has(#seccionLogin:not([hidden])) main {margin-left:0; display:grid; place-items:center; min-height:100vh;}
body:has(#seccionLogin:not([hidden])) header {position:absolute; width:100%; height:auto; background:transparent; text-align:center; padding:36px;}
body:has(#seccionLogin:not([hidden])) header h1 {color:var(--navy);}
body:has(#seccionLogin:not([hidden])) header p {color:var(--muted);}
body:has(#seccionLogin:not([hidden])) {background:radial-gradient(circle at 80% 15%,#d8e9ff 0%,transparent 38%),var(--page);}
#seccionSistema {max-width:1500px; margin:auto;}
.usuario {
  background:white; border:1px solid var(--line); border-radius:14px;
  box-shadow:0 5px 24px #12284b08; padding:15px 20px; margin-bottom:24px;
}
#datosUsuario {font-size:13px; font-weight:700; color:var(--navy2);}
.usuario button {background:#eef4ff; color:var(--blue); font-weight:750; border-radius:9px;}
.usuario button:hover {background:#dce9ff;}
.panel {border:1px solid var(--line); border-radius:18px; box-shadow:0 10px 38px #152c5210; padding:clamp(20px,2.5vw,36px);}
.panel > h2 {font-size:clamp(24px,2.4vw,34px); margin:0 0 10px; color:var(--navy); letter-spacing:-.7px;}
#descripcion {font-size:14px; color:var(--muted); line-height:1.7; margin:0 0 24px;}
.cards {gap:18px;}
.card {
  background:linear-gradient(145deg,#fff,#f8fbff); border:1px solid var(--line);
  border-left:0; border-radius:15px; padding:24px;
  box-shadow:0 7px 25px #152c5209; transition:transform .2s,box-shadow .2s;
}
.card:hover {transform:translateY(-4px); box-shadow:0 13px 30px #152c521c;}

.card p,.resumen .card p {font-size:clamp(24px,2.4vw,32px); color:var(--navy); letter-spacing:-.6px;}

table {border-collapse:separate; border-spacing:0;}
th {background:#f0f5fc; color:#4c607f; font-size:12px; text-transform:uppercase; letter-spacing:.5px; padding:16px;}
td {font-size:13px; padding:15px; border-color:var(--line);}
tr:nth-child(even) {background:#f9fbff;}
tbody tr:hover {background:#eff6ff;}
#tablaProductos tbody tr[data-id]:hover,#tablaProductos tbody tr[data-id]:focus {background:#eaf3ff;}
#tablaProductos tbody tr.seleccionado {background:#e7f1ff;box-shadow:inset 4px 0 0 var(--blue);}
.etiqueta-disponible {background:#dcfce7;color:#157347;}
.etiqueta-bajo {background:#fff3cf;color:#995c00;}
.etiqueta-agotado {background:#fee2e2;color:#b91c1c;}
.productos-layout {grid-template-columns:minmax(0,1.45fr) minmax(320px,1fr);gap:24px;}
.productos-herramientas {margin:0 0 16px;}
.productos-herramientas input,.productos-herramientas select,
.compras-campo input,.compras-campo select,.login input {

}
.productos-herramientas input:focus,.productos-herramientas select:focus,
.compras-campo input:focus,.compras-campo select:focus,.login input:focus {

}
.visor3d-panel {

  border:1px solid #c8defa; border-radius:17px; padding:19px;

}
.visor3d-panel h3 {color:var(--navy);font-size:19px;}
.visor3d {height:370px; background:radial-gradient(circle at 50% 35%,#ffffff,#d9ebff);border:1px solid #d6e7fa;}
.visor3d canvas:focus-visible {outline:3px solid var(--blue);}
.visor3d-ayuda {color:#617b9d;}
.compras-aviso {background:#eff6ff;border-left:4px solid var(--blue);color:#35547e;}

.compras-acciones button:hover:not(:disabled) {background:#1d4ed8;}
.compras-total {color:var(--navy);}
.mensaje {background:#eff6ff;color:#2e5181;}
.login {width:min(440px,100%); margin:80px auto 20px; padding:38px;}
.login h2 {color:var(--navy);font-size:27px;}
.login button {background:var(--blue);border-radius:10px;}
footer {margin-left:248px;background:var(--navy);color:#a4b7d3;font-size:12px;padding:18px;}
body:has(#seccionLogin:not([hidden])) footer {margin-left:0;background:transparent;color:var(--muted);}
@media(max-width:1050px) {.productos-layout{grid-template-columns:1fr}.visor3d-panel{position:static;order:0;}.visor3d{height:340px;}}
@media(max-width:760px) {
 header {position:relative;width:100%;height:auto;padding:17px 20px;}
 header h1 {font-size:23px;} header p{font-size:11px;}
 nav#menu {position:sticky;top:0;bottom:auto;width:100%;height:auto;flex-direction:row;gap:5px;padding:10px;overflow-x:auto;box-shadow:0 6px 18px #0b193322;}

 .card p,.resumen .card p{font-size:21px;}

}
@media(prefers-reduced-motion:reduce) {*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important;}}


    /* Ventas: hereda la apariencia azul marino del dashboard */

<body>

  <header>
    <h1>DR. JIBA</h1>
    <p>Sistema de Compras, Ventas e Inventario</p>
  </header>

  <nav id="menu" hidden>
    <button onclick="mostrar('Inicio')">Inicio</button>
    <button onclick="mostrar('Productos')">Productos</button>
    <button onclick="mostrar('Compras')">Compras</button>
    <button onclick="mostrar('Ventas')">Ventas</button>
    <button onclick="mostrar('Inventario')">Inventario</button>
  </nav>

  <main>

    <section id="seccionLogin" class="panel login">
      <h2>Iniciar sesión</h2>
      <p style="text-align:center">
        Acceso al sistema administrativo DR. JIBA
      </p>

      <form id="formLogin">
        <label for="correo">Correo electrónico</label>
        <input
          type="email"
          id="correo"
          placeholder="administrador@correo.com"
          autocomplete="username"
          required
        >

        <label for="contrasena">Contraseña</label>
        <input
          type="password"
          id="contrasena"
          placeholder="Ingresa tu contraseña"
          autocomplete="current-password"
          required
        >

        <button type="submit" id="btnIngresar">
          Ingresar al sistema
        </button>
      </form>

      <p id="errorLogin" class="error" role="alert"></p>
    </section>

    <section id="seccionSistema" hidden>

      <div class="usuario">
        <span id="datosUsuario">Administrador DR. JIBA</span>
        <button onclick="cerrarSesion()">Cerrar sesión</button>
      </div>

      <section class="panel">
        <h2 id="titulo">Panel Principal</h2>

        <p id="descripcion">
          Bienvenido al sistema de gestión del restaurante DR. JIBA.
        </p>

        <div class="cards" id="contenido"></div>
      </section>

    </section>

  </main>

  <footer>
    DR. JIBA - Sistema de Gestión
  </footer>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
      }
    }
  </script>

  <script
    type="module"
    src="js/productos3d.js"
    onerror="window.DrJiba3DError = true; window.dispatchEvent(new Event('drjiba3d:error'));"
  ></script>

  <script>
    const API = "";

    let tokenAcceso = sessionStorage.getItem("drjiba_token");
    let sesionActual = 0;
    let vistaActual = 0;

    const STOCK_BAJO = 5;

    const login = document.getElementById("seccionLogin");
    const sistema = document.getElementById("seccionSistema");
    const menu = document.getElementById("menu");

    function verLogin() {
      sesionActual++;
      vistaActual++;
      destruirVisor3D();
      tokenAcceso = null;
      sessionStorage.removeItem("drjiba_token");
      login.hidden = false;
      sistema.hidden = true;
      menu.hidden = true;
      document.getElementById("contrasena").value = "";
    }

    function verSistema() {
      login.hidden = true;
      sistema.hidden = false;
      menu.hidden = false;
      mostrar("Inicio");
    }

    async function peticionProtegida(ruta) {
      if (!tokenAcceso) {
        throw new Error("Debes iniciar sesión");
      }

      const respuesta = await fetch(API + ruta, {
        headers: {
          Authorization: "Bearer " + tokenAcceso
        }
      });

      if (respuesta.status === 401) {
        verLogin();
        throw new Error("La sesión ha expirado");
      }

      if (!respuesta.ok) {
        throw new Error("Error al consultar el servidor");
      }

      return await respuesta.json();
    }

    async function validarSesion() {
      if (!tokenAcceso) {
        verLogin();
        return;
      }

      const intento = ++sesionActual;

      try {
        const perfil = await peticionProtegida("/api/mi-perfil");

        if (intento !== sesionActual) return;

        if (!perfil || perfil.activo === false) {
          throw new Error("Usuario inactivo");
        }

        const nombre = perfil.nombre_completo || "Usuario";
        const rol = perfil.rol || "Sin rol";

        document.getElementById("datosUsuario").textContent =
          nombre + " | " + rol;

        verSistema();

      } catch (error) {
        if (intento !== sesionActual) return;
        console.error("No se pudo validar la sesión:", error.message);
        verLogin();
      }
    }

    document.getElementById("formLogin").addEventListener(
      "submit",
      async function(evento) {
        evento.preventDefault();

        const correo = document.getElementById("correo").value.trim();
        const contrasena = document.getElementById("contrasena").value;
        const errorLogin = document.getElementById("errorLogin");
        const boton = document.getElementById("btnIngresar");

        errorLogin.textContent = "";
        boton.disabled = true;
        boton.textContent = "Ingresando...";

        try {
          const respuesta = await fetch(API + "/api/login", {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              email: correo,
              password: contrasena
            })
          });

          const resultado = await respuesta.json();

          if (!respuesta.ok) {
            throw new Error(
              resultado.error || "No se pudo iniciar sesión"
            );
          }

          const token =
            resultado.access_token ||
            resultado.session?.access_token;

          if (!token) {
            throw new Error("El servidor no devolvió un token");
          }

          tokenAcceso = token;
          sessionStorage.setItem("drjiba_token", token);

          await validarSesion();

          if (!tokenAcceso) {
            errorLogin.textContent =
              "No se pudo validar tu perfil. Revisa los permisos.";
          }

        } catch (error) {
          errorLogin.textContent = error.message;
        } finally {
          boton.disabled = false;
          boton.textContent = "Ingresar al sistema";
        }
      }
    );

    function cerrarSesion() {
      verLogin();
      document.getElementById("errorLogin").textContent = "";
    }

    async function obtenerProductos() {
      return await peticionProtegida("/api/productos");
    }

    async function mostrar(modulo) {
      if (!tokenAcceso) {
        verLogin();
        return;
      }

      vistaActual++;
      destruirVisor3D();

      // Resaltar el módulo actual en el menú lateral.
      document.querySelectorAll("#menu button").forEach(boton => {
        const activo = boton.textContent.trim() === modulo;
        boton.classList.toggle("activo", activo);
        if (activo) boton.setAttribute("aria-current", "page");
        else boton.removeAttribute("aria-current");
      });

      const titulo = document.getElementById("titulo");
      const descripcion = document.getElementById("descripcion");
      const contenido = document.getElementById("contenido");

      titulo.textContent =
        modulo === "Inicio" ? "Panel Principal" : modulo;

      if (modulo === "Inicio") {
        descripcion.textContent =
          "Bienvenido al sistema de gestión del restaurante DR. JIBA.";

        contenido.style.display = "grid";

        contenido.innerHTML = `
          <div class="card">
            <h3>Productos</h3>
            <p id="totalProductos">—</p>
          </div>
          <div class="card">
            <h3>Compras</h3>
            <p>—</p>
          </div>
          <div class="card">
            <h3>Ventas</h3>
            <p>—</p>
          </div>
          <div class="card">
            <h3>Unidades en stock</h3>
            <p id="totalStock">—</p>
          </div>
        `;

        try {
          const productos = await obtenerProductos();

          const stockTotal = productos.reduce(
            (total, producto) =>
              total + Number(producto.stock_actual || 0),
            0
          );

          const totalProductos =
            document.getElementById("totalProductos");
          const totalStock =
            document.getElementById("totalStock");

          if (totalProductos) {
            totalProductos.textContent = productos.length;
          }

          if (totalStock) {
            totalStock.textContent = stockTotal;
          }
        } catch (error) {
          console.error(error);
        }

        return;
      }

      if (modulo === "Productos") {
        await mostrarProductos(vistaActual);
        return;
      }

      if (modulo === "Compras") {
        await mostrarCompras(vistaActual);
        return;
      }
      
      if (modulo === "Ventas") {
  await mostrarVentas(vistaActual);
  return;
}

      if (modulo === "Inventario") {
        descripcion.textContent =
          "Información actualizada desde Supabase.";

        contenido.style.display = "block";
        contenido.innerHTML =
          '<p class="mensaje">Cargando productos...</p>';

        try {
          const productos = await obtenerProductos();

          contenido.innerHTML = "";

          if (productos.length === 0) {
            contenido.textContent =
              "No hay productos registrados.";
            return;
          }

          const contenedor = document.createElement("div");
          contenedor.className = "tabla-contenedor";

          const tabla = document.createElement("table");
          const encabezado = document.createElement("thead");
          const filaEncabezado = document.createElement("tr");

          [
            "ID",
            "Producto",
            "Precio de venta",
            "Stock actual"
          ].forEach(nombre => {
            const th = document.createElement("th");
            th.textContent = nombre;
            filaEncabezado.appendChild(th);
          });

          encabezado.appendChild(filaEncabezado);
          tabla.appendChild(encabezado);

          const cuerpo = document.createElement("tbody");

          productos.forEach(producto => {
            const fila = document.createElement("tr");

            [
              producto.id_producto,
              producto.nombre,
              "Bs " + Number(producto.precio_venta).toFixed(2),
              producto.stock_actual
            ].forEach((valor, indice) => {
              const celda = document.createElement("td");
              celda.textContent = valor;

              if (
                indice === 3 &&
                Number(producto.stock_actual) === 0
              ) {
                celda.className = "stock-bajo";
              }

              fila.appendChild(celda);
            });

            cuerpo.appendChild(fila);
          });

          tabla.appendChild(cuerpo);
          contenedor.appendChild(tabla);
          contenido.appendChild(contenedor);

        } catch (error) {
          console.error(error);
          contenido.innerHTML =
            '<p class="mensaje">Error al cargar los productos. Intenta nuevamente.</p>';
        }

        return;
      }

      descripcion.textContent =
        "Módulo de " + modulo + " en preparación.";

      contenido.style.display = "none";
    }

    
    // ========================================
    // MODULO DE VENTAS - DR. JIBA
    // ========================================

    async function mostrarVentas(vista) {
      const descripcion = document.getElementById("descripcion");
      const contenido = document.getElementById("contenido");

      descripcion.textContent =
        "Registra ventas, consulta el historial y confirma salidas de inventario.";

      contenido.style.display = "block";
      contenido.innerHTML =
        '<p class="mensaje">Cargando clientes, productos y ventas...</p>';

      let productos, clientes, ventas;

      try {
        [productos, clientes, ventas] = await Promise.all([
          obtenerProductos(),
          peticionProtegida("/api/clientes"),
          peticionProtegida("/api/ventas")
        ]);
      } catch (error) {
        if (vista !== vistaActual) return;
        contenido.textContent =
          "No se pudieron cargar las ventas: " + error.message;
        return;
      }

      if (vista !== vistaActual) return;

      contenido.innerHTML = `
        <div class="compras-aviso">
          Guardar una venta en BORRADOR no modifica el stock.
          Confirmarla descontará las unidades y registrará
          una SALIDA en el inventario.
        </div>

        <h3>Nueva venta</h3>

        <div class="compras-formulario">
          <div class="compras-campo">
            <label for="ventaCliente">Cliente</label>
            <select id="ventaCliente"></select>
          </div>

          <div class="compras-campo">
            <label for="ventaObservaciones">Observaciones</label>
            <input id="ventaObservaciones" type="text"
              maxlength="500" placeholder="Opcional">
          </div>

          <div class="compras-campo">
            <label for="ventaProducto">Producto</label>
            <select id="ventaProducto"></select>
          </div>

          <div class="compras-campo">
            <label for="ventaCantidad">Cantidad</label>
            <input id="ventaCantidad" type="number"
              min="1" step="1" value="1">
          </div>

          <div class="compras-campo">
            <label for="ventaPrecio">Precio de venta</label>
            <input id="ventaPrecio" type="text" readonly>
          </div>

          <div class="compras-campo">
            <label for="ventaStock">Stock disponible</label>
            <input id="ventaStock" type="text" readonly>
          </div>
        </div>

        <div class="compras-acciones">
          <button type="button" id="agregarDetalleVenta">
            Agregar producto
          </button>
          <button type="button" id="limpiarDetalleVenta">
            Limpiar lista
          </button>
        </div>

        <p id="mensajeVenta" aria-live="polite"></p>

        <div class="tabla-contenedor">
          <table>
            <thead>
              <tr>
                <th>Producto</th>
                <th>Cantidad</th>
                <th>Precio</th>
                <th>Subtotal</th>
                <th>Acción</th>
              </tr>
            </thead>
            <tbody id="detallesVenta"></tbody>
          </table>
        </div>

        <p class="compras-total" id="totalVenta">
          Total: Bs 0.00
        </p>

        <div class="compras-acciones">
          <button type="button" id="guardarBorradorVenta">
            Guardar borrador
          </button>
          <button type="button" id="confirmarVenta" disabled>
            Confirmar venta
          </button>
        </div>

        <p id="ventaPendiente" aria-live="polite"></p>

        <h3>Historial de ventas</h3>
        <div class="tabla-contenedor">
          <table>
            <thead>
              <tr>
                <th>N.º</th>
                <th>Cliente</th>
                <th>Fecha</th>
                <th>Total</th>
                <th>Estado</th>
                <th>Acción</th>
              </tr>
            </thead>
            <tbody id="historialVentas"></tbody>
          </table>
        </div>
      `;

      const clienteSelect = document.getElementById("ventaCliente");
      const productoSelect = document.getElementById("ventaProducto");
      const cantidadInput = document.getElementById("ventaCantidad");
      const precioInput = document.getElementById("ventaPrecio");
      const stockInput = document.getElementById("ventaStock");
      const mensaje = document.getElementById("mensajeVenta");
      const cuerpo = document.getElementById("detallesVenta");
      const guardar = document.getElementById("guardarBorradorVenta");
      const confirmar = document.getElementById("confirmarVenta");
      const pendiente = document.getElementById("ventaPendiente");
      const historial = document.getElementById("historialVentas");

      const detalles = [];
      let idVentaGuardada = null;
      let trabajando = false;

      clienteSelect.add(new Option("Selecciona un cliente", ""));

      clientes.forEach(cliente => {
        clienteSelect.add(
          new Option(cliente.nombre, String(cliente.id_cliente))
        );
      });

      productoSelect.add(new Option("Selecciona un producto", ""));

      productos.forEach(producto => {
        productoSelect.add(
          new Option(producto.nombre, String(producto.id_producto))
        );
      });

      function actualizarProducto() {
        const producto = productos.find(
          p => String(p.id_producto) === productoSelect.value
        );

        precioInput.value = producto
          ? formatoBs(producto.precio_venta)
          : "";

        stockInput.value = producto
          ? String(producto.stock_actual)
          : "";
      }

      productoSelect.addEventListener("change", actualizarProducto);
      actualizarProducto();

      function actualizarBotones() {
        guardar.disabled =
          trabajando ||
          idVentaGuardada !== null ||
          !clientes.length ||
          !productos.length;

        confirmar.disabled =
          trabajando || idVentaGuardada === null;

        pendiente.textContent = idVentaGuardada === null
          ? "No hay una venta pendiente seleccionada."
          : "Venta N.º " + idVentaGuardada +
            " pendiente de confirmación.";
      }

      function dibujarDetalles() {
        cuerpo.replaceChildren();

        if (!detalles.length) {
          const fila = cuerpo.insertRow();
          const celda = fila.insertCell();
          celda.colSpan = 5;
          celda.textContent = "Todavía no agregaste productos.";
        }

        detalles.forEach((item, indice) => {
          const fila = cuerpo.insertRow();

          [
            item.nombre,
            item.cantidad,
            formatoBs(item.precio),
            formatoBs(item.cantidad * item.precio)
          ].forEach(valor => {
            fila.insertCell().textContent = valor;
          });

          const boton = document.createElement("button");
          boton.type = "button";
          boton.textContent = "Quitar";
          boton.disabled = trabajando || idVentaGuardada !== null;

          boton.addEventListener("click", () => {
            detalles.splice(indice, 1);
            dibujarDetalles();
          });

          fila.insertCell().appendChild(boton);
        });

        const total = detalles.reduce(
          (suma, item) => suma + item.cantidad * item.precio,
          0
        );

        document.getElementById("totalVenta").textContent =
          "Total estimado: " + formatoBs(total);
      }

      function dibujarHistorial() {
        historial.replaceChildren();

        if (!ventas.length) {
          const celda = historial.insertRow().insertCell();
          celda.colSpan = 6;
          celda.textContent = "No hay ventas registradas.";
          return;
        }

        ventas.forEach(venta => {
          const fila = historial.insertRow();

          const cliente = clientes.find(
            c => String(c.id_cliente) === String(venta.id_cliente)
          );

          const fecha = venta.fecha_venta
            ? new Date(venta.fecha_venta).toLocaleString("es-BO")
            : "Sin fecha";

          [
            venta.id_venta,
            cliente ? cliente.nombre : "Cliente no disponible",
            fecha,
            formatoBs(venta.total_venta),
            venta.estado
          ].forEach(valor => {
            fila.insertCell().textContent = valor;
          });

          const celdaAccion = fila.insertCell();

          if (venta.estado === "BORRADOR") {
            const boton = document.createElement("button");
            boton.type = "button";
            boton.textContent = "Seleccionar";
            boton.disabled = trabajando;

            boton.addEventListener("click", () => {
              if (trabajando) return;

              if (
                idVentaGuardada !== null &&
                idVentaGuardada !== Number(venta.id_venta)
              ) {
                mensaje.textContent =
                  "Primero confirma o revisa la venta pendiente.";
                return;
              }

              idVentaGuardada = Number(venta.id_venta);
              mensaje.textContent =
                "Seleccionaste la venta N.º " + idVentaGuardada +
                ". Revisa sus datos antes de confirmar.";

              actualizarBotones();
            });

            celdaAccion.appendChild(boton);
          } else {
            celdaAccion.textContent = "—";
          }
        });
      }

      document.getElementById("agregarDetalleVenta")
        .addEventListener("click", () => {
          if (trabajando || idVentaGuardada !== null) return;

          const producto = productos.find(
            p => String(p.id_producto) === productoSelect.value
          );

          const cantidad = Number(cantidadInput.value);

          if (
            !producto ||
            !Number.isSafeInteger(cantidad) ||
            cantidad <= 0
          ) {
            mensaje.textContent =
              "Selecciona un producto y una cantidad válida.";
            return;
          }

          if (detalles.some(
            d => d.id_producto === producto.id_producto
          )) {
            mensaje.textContent =
              "Ese producto ya está agregado.";
            return;
          }

          if (cantidad > Number(producto.stock_actual)) {
            mensaje.textContent =
              "Stock insuficiente para ese producto.";
            return;
          }

          const precio = Number(producto.precio_venta);

          if (!Number.isFinite(precio) || precio < 0) {
            mensaje.textContent = "Precio de producto inválido.";
            return;
          }

          detalles.push({
            id_producto: producto.id_producto,
            nombre: producto.nombre,
            cantidad,
            precio
          });

          mensaje.textContent = "Producto agregado.";
          dibujarDetalles();
        });

      document.getElementById("limpiarDetalleVenta")
        .addEventListener("click", () => {
          if (trabajando || idVentaGuardada !== null) return;
          detalles.length = 0;
          dibujarDetalles();
          mensaje.textContent = "Lista vaciada.";
        });

      async function enviarVenta(ruta, datos) {
        const respuesta = await fetch(API + ruta, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            Authorization: "Bearer " + tokenAcceso
          },
          body: datos ? JSON.stringify(datos) : undefined
        });

        const resultado = await respuesta.json().catch(() => ({}));

        if (respuesta.status === 401) {
          verLogin();
          throw new Error("La sesión ha expirado.");
        }

        if (!respuesta.ok) {
          throw new Error(resultado.error || "Error en la operación.");
        }

        return resultado;
      }

      guardar.addEventListener("click", async () => {
        if (trabajando || idVentaGuardada !== null) return;

        const idCliente = Number(clienteSelect.value);

        if (!Number.isSafeInteger(idCliente) || idCliente <= 0) {
          mensaje.textContent = "Selecciona un cliente.";
          return;
        }

        if (!detalles.length) {
          mensaje.textContent = "Agrega al menos un producto.";
          return;
        }

        trabajando = true;
        guardar.textContent = "Guardando...";
        actualizarBotones();

        try {
          const resultado = await enviarVenta("/api/ventas", {
            id_cliente: idCliente,
            observaciones:
              document.getElementById("ventaObservaciones").value.trim(),
            productos: detalles.map(d => ({
              id_producto: d.id_producto,
              cantidad: d.cantidad
            }))
          });

          if (vista !== vistaActual) return;

          const id = Number(resultado.id_venta);

          if (!Number.isSafeInteger(id) || id <= 0) {
            throw new Error(
              "La venta se guardó, pero no se recibió un ID válido. " +
              "Consulta el historial antes de volver a guardar."
            );
          }

          idVentaGuardada = id;
          detalles.length = 0;
          dibujarDetalles();

          mensaje.textContent =
            "Venta N.º " + id + " guardada como BORRADOR.";

          await recargarHistorial();

        } catch (error) {
          if (vista === vistaActual) {
            mensaje.textContent = "Error: " + error.message;
          }
        } finally {
          trabajando = false;
          if (vista === vistaActual) {
            guardar.textContent = "Guardar borrador";
            actualizarBotones();
            dibujarDetalles();
          }
        }
      });

      async function recargarHistorial() {
        try {
          const nuevosDatos = await peticionProtegida("/api/ventas");

          if (vista !== vistaActual) return;

          ventas = nuevosDatos;
          dibujarHistorial();
        } catch (error) {
          if (vista === vistaActual) {
            mensaje.textContent +=
              " No se pudo actualizar el historial.";
          }
        }
      }

      confirmar.addEventListener("click", async () => {
        if (trabajando || idVentaGuardada === null) return;

        const id = idVentaGuardada;

        const aceptado = window.confirm(
          "¿Confirmar la venta N.º " + id + "?\n\n" +
          "Se descontará el stock y se registrará " +
          "una salida de inventario. Esta acción no se puede repetir."
        );

        if (!aceptado) return;

        trabajando = true;
        confirmar.textContent = "Confirmando...";
        actualizarBotones();

        try {
          await enviarVenta(
            "/api/ventas/" + encodeURIComponent(id) + "/confirmar"
          );

          if (vista !== vistaActual) return;

          idVentaGuardada = null;

          mensaje.textContent =
            "Venta N.º " + id +
            " confirmada correctamente. Inventario actualizado.";

          await recargarHistorial();

          // Actualizar stock visible para futuras ventas.
          productos = await obtenerProductos();

          if (vista !== vistaActual) return;

          productoSelect.replaceChildren();
          productoSelect.add(
            new Option("Selecciona un producto", "")
          );

          productos.forEach(p => {
            productoSelect.add(
              new Option(p.nombre, String(p.id_producto))
            );
          });

          actualizarProducto();

        } catch (error) {
          if (vista === vistaActual) {
            mensaje.textContent =
              "Error: " + error.message +
              " Revisa el historial antes de volver a confirmar.";
          }
        } finally {
          trabajando = false;

          if (vista === vistaActual) {
            confirmar.textContent = "Confirmar venta";
            actualizarBotones();
          }
        }
      });

      dibujarDetalles();
      dibujarHistorial();
      actualizarBotones();
    }


    // ========================================
    // MODULO DE COMPRAS
    // ========================================
    async function mostrarCompras(vista) {
      const descripcion = document.getElementById("descripcion");
      const contenido = document.getElementById("contenido");
      descripcion.textContent = "Registra compras en borrador y confirma una compra guardada para actualizar el inventario.";
      contenido.style.display = "block";

      let productos, proveedores;
      try {
        [productos, proveedores] = await Promise.all([
          obtenerProductos(),
          peticionProtegida("/api/proveedores")
        ]);
      } catch (error) {
        if (vista !== vistaActual) return;
        contenido.textContent = "No se pudieron cargar los datos de compras: " + error.message;
        return;
      }
      if (vista !== vistaActual) return;

      contenido.innerHTML = `
        <div class="compras-aviso" role="status">
          Guardar borrador no modifica el stock. Confirmar una compra guardada aumenta el inventario y registra sus movimientos. Revisa bien los datos antes de confirmar.
        </div>
        <h3>Nueva compra</h3>
        <div class="compras-formulario">

            <label for="compraProveedor">Proveedor</label>
            <select id="compraProveedor"></select>
          </div>
          <div class="compras-campo">
            <label for="compraObservaciones">Observaciones (opcional)</label>
            <input id="compraObservaciones" type="text" maxlength="500" placeholder="Detalle de la compra">
          </div>
          <div class="compras-campo">
            <label for="compraProducto">Producto</label>
            <select id="compraProducto"></select>
          </div>
          <div class="compras-campo">
            <label for="compraCantidad">Cantidad</label>
            <input id="compraCantidad" type="number" min="1" step="1" value="1">
          </div>
          <div class="compras-campo">
            <label for="compraPrecio">Precio de compra (Bs)</label>
            <input id="compraPrecio" type="number" min="0" step="0.01" placeholder="0.00">
          </div>
        </div>
        <div class="compras-acciones">
          <button type="button" id="agregarDetalleCompra">Agregar producto</button>
          <button type="button" id="limpiarDetalleCompra">Limpiar lista</button>
        </div>
        <p id="mensajeCompra" aria-live="polite"></p>
        <div class="tabla-contenedor">
          <table>
            <thead><tr><th>Producto</th><th>Cantidad</th><th>Precio unitario</th><th>Subtotal</th><th>Acción</th></tr></thead>
            <tbody id="detallesCompra"><tr><td colspan="5">Todavía no agregaste productos.</td></tr></tbody>
          </table>
        </div>
        <p class="compras-total" id="totalCompra">Total: Bs 0.00</p>
        <div class="compras-acciones">
          <button type="button" id="guardarBorradorCompra">Guardar borrador</button>
          <button type="button" id="confirmarCompra" disabled title="Primero guarda una compra como borrador">Confirmar compra</button>
        </div>
        <p id="compraPendiente" aria-live="polite">No hay una compra pendiente de confirmación en esta pantalla.</p>`;

      const selector = document.getElementById("compraProducto");
      const proveedorSelect = document.getElementById("compraProveedor");
      const cantidad = document.getElementById("compraCantidad");
      const precio = document.getElementById("compraPrecio");
      const mensaje = document.getElementById("mensajeCompra");
      const cuerpo = document.getElementById("detallesCompra");
      const guardar = document.getElementById("guardarBorradorCompra");
      const confirmar = document.getElementById("confirmarCompra");
      const compraPendiente = document.getElementById("compraPendiente");
      const detalles = [];
      let guardando = false;
      let confirmando = false;
      let idCompraGuardada = null;

      function actualizarConfirmacion() {
        confirmar.disabled = guardando || confirmando || idCompraGuardada === null;
        compraPendiente.textContent = idCompraGuardada === null
          ? "No hay una compra pendiente de confirmación en esta pantalla."
          : "Compra N.º " + idCompraGuardada + " guardada como BORRADOR y pendiente de confirmación.";
      }

      proveedorSelect.add(new Option("Selecciona un proveedor", ""));
      proveedores.filter(p => p.activo !== false).forEach(p => {
        proveedorSelect.add(new Option(p.nombre, String(p.id_proveedor)));
      });
      productos.forEach(p => selector.add(new Option(p.nombre, String(p.id_producto))));
      if (!productos.length || proveedores.filter(p => p.activo !== false).length === 0) {
        guardar.disabled = true;
        mensaje.textContent = "Necesitas al menos un producto y un proveedor activo.";
      }

      function dibujarDetalles() {
        cuerpo.replaceChildren();
        if (!detalles.length) {
          const celda = cuerpo.insertRow().insertCell();
          celda.colSpan = 5;
          celda.textContent = "Todavía no agregaste productos.";
        }
        detalles.forEach((item, indice) => {
          const fila = cuerpo.insertRow();
          [item.nombre, item.cantidad, formatoBs(item.precio), formatoBs(item.cantidad * item.precio)]
            .forEach(valor => { fila.insertCell().textContent = valor; });
          const boton = document.createElement("button");
          boton.type = "button";
          boton.textContent = "Quitar";
          boton.disabled = guardando || confirmando;
          boton.addEventListener("click", () => {
            detalles.splice(indice, 1);
            dibujarDetalles();
          });
          fila.insertCell().appendChild(boton);
        });
        const total = detalles.reduce((suma, item) => suma + item.cantidad * item.precio, 0);
        document.getElementById("totalCompra").textContent = "Total: " + formatoBs(total);
      }

      document.getElementById("agregarDetalleCompra").addEventListener("click", () => {
        if (guardando || confirmando) return;
        const producto = productos.find(p => String(p.id_producto) === selector.value);
        const unidades = Number(cantidad.value);
        const costo = Number(precio.value);
        if (!producto || !Number.isSafeInteger(unidades) || unidades <= 0 ||
            precio.value.trim() === "" || !Number.isFinite(costo) || costo < 0 ||
            !Number.isInteger(Math.round(costo * 100))) {
          mensaje.textContent = "Selecciona un producto, una cantidad entera positiva y un precio válido.";
          return;
        }
        if (detalles.some(d => d.id_producto === producto.id_producto)) {
          mensaje.textContent = "Ese producto ya está agregado. Quítalo para cambiar su cantidad.";
          return;
        }
        detalles.push({ id_producto: producto.id_producto, nombre: producto.nombre, cantidad: unidades, precio: costo });
        mensaje.textContent = "Producto agregado a la lista.";
        dibujarDetalles();
      });

      document.getElementById("limpiarDetalleCompra").addEventListener("click", () => {
        if (guardando || confirmando) return;
        detalles.length = 0;
        mensaje.textContent = "Lista vaciada.";
        dibujarDetalles();
      });

      guardar.addEventListener("click", async () => {
        if (guardando || confirmando) return;
        const idProveedor = Number(proveedorSelect.value);
        if (!Number.isSafeInteger(idProveedor) || idProveedor <= 0) {
          mensaje.textContent = "Selecciona un proveedor.";
          return;
        }
        if (!detalles.length) {
          mensaje.textContent = "Agrega al menos un producto.";
          return;
        }
        guardando = true;
        guardar.disabled = true;
        guardar.textContent = "Guardando...";
        actualizarConfirmacion();
        mensaje.textContent = "Registrando borrador...";
        dibujarDetalles();
        try {
          const respuesta = await fetch(API + "/api/compras", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              Authorization: "Bearer " + tokenAcceso
            },
            body: JSON.stringify({
              id_proveedor: idProveedor,
              observaciones: document.getElementById("compraObservaciones").value.trim() || null,
              productos: detalles.map(d => ({
                id_producto: d.id_producto,
                cantidad: d.cantidad,
                precio_unitario: d.precio
              }))
            })
          });
          const resultado = await respuesta.json().catch(() => ({}));
          if (respuesta.status === 401) {
            verLogin();
            throw new Error("La sesión ha expirado.");
          }
          if (!respuesta.ok) throw new Error(resultado.error || "No se pudo guardar la compra.");
          if (vista !== vistaActual) return;
          const nuevoId = Number(resultado.id_compra);
          if (!Number.isSafeInteger(nuevoId) || nuevoId <= 0) {
            throw new Error("El servidor guardó la compra, pero no devolvió un número válido. Consulta Supabase antes de repetir el guardado.");
          }
          idCompraGuardada = nuevoId;
          detalles.length = 0;
          dibujarDetalles();
          actualizarConfirmacion();
          mensaje.textContent = "Borrador guardado correctamente. Compra N.º " + nuevoId + ". El inventario no se ha modificado.";
        } catch (error) {
          if (vista === vistaActual) mensaje.textContent = "Error: " + error.message;
        } finally {
          guardando = false;
          if (vista === vistaActual) {
            guardar.disabled = false;
            guardar.textContent = "Guardar borrador";
            actualizarConfirmacion();
            dibujarDetalles();
          }
        }
      });

      confirmar.addEventListener("click", async () => {
        if (guardando || confirmando || idCompraGuardada === null) return;
        const idAConfirmar = idCompraGuardada;
        if (!Number.isSafeInteger(idAConfirmar) || idAConfirmar <= 0) {
          mensaje.textContent = "Número de compra inválido.";
          return;
        }
        const aceptado = window.confirm(
          "¿Confirmar la compra N.º " + idAConfirmar + "?\n\n" +
          "Esta acción aumentará el stock, registrará entradas en el inventario " +
          "y no se podrá repetir."
        );
        if (!aceptado) return;

        confirmando = true;
        confirmar.textContent = "Confirmando...";
        guardar.disabled = true;
        actualizarConfirmacion();
        mensaje.textContent = "Confirmando compra N.º " + idAConfirmar + "...";
        dibujarDetalles();

        try {
          const respuesta = await fetch(
            API + "/api/compras/" + encodeURIComponent(idAConfirmar) + "/confirmar",
            {
              method: "POST",
              headers: { Authorization: "Bearer " + tokenAcceso }
            }
          );
          const resultado = await respuesta.json().catch(() => ({}));
          if (respuesta.status === 401) {
            verLogin();
            throw new Error("La sesión ha expirado.");
          }
          if (!respuesta.ok) {
            throw new Error(resultado.error || "No se pudo confirmar la compra.");
          }
          idCompraGuardada = null;
          if (vista === vistaActual) {
            mensaje.textContent = "Compra N.º " + idAConfirmar +
              " confirmada correctamente. El inventario fue actualizado.";
          }
        } catch (error) {
          if (vista === vistaActual) {
            mensaje.textContent = "Error: " + error.message +
              " Si la solicitud se interrumpió, revisa el estado en Supabase antes de reintentar.";
          }
        } finally {
          confirmando = false;
          if (vista === vistaActual) {
            confirmar.textContent = "Confirmar compra";
            guardar.disabled = !productos.length || !proveedores.some(p => p.activo !== false);
            actualizarConfirmacion();
            dibujarDetalles();
          }
        }
      });
    }


    // ========================================
    // MODULO DE VENTAS
    // ========================================
    async function mostrarVentas(vista) {
      const descripcion = document.getElementById("descripcion");
      const contenido = document.getElementById("contenido");
      descripcion.textContent = "Registra ventas en borrador, confirma la salida de productos y consulta el historial.";
      contenido.style.display = "block";
      contenido.innerHTML = '<p class="mensaje">Cargando productos, clientes y ventas...</p>';

      let productos, clientes, ventas;
      try {
        [productos, clientes, ventas] = await Promise.all([
          obtenerProductos(),
          peticionProtegida("/api/clientes"),
          peticionProtegida("/api/ventas")
        ]);
      } catch (error) {
        if (vista !== vistaActual) return;
        contenido.textContent = "No se pudo abrir Ventas: " + error.message;
        return;
      }
      if (vista !== vistaActual) return;

      contenido.innerHTML = `
        <div class="ventas-estado">Guardar un borrador no descuenta existencias. Al confirmar, Supabase valida el stock y registra la salida en el inventario.</div>
        <section class="ventas-seccion">
          <h3>Nueva venta</h3>
          <div class="ventas-formulario">
            <div class="ventas-campo"><label for="ventaCliente">Cliente</label><select id="ventaCliente"></select></div>
            <div class="ventas-campo"><label for="ventaObservaciones">Observaciones (opcional)</label><input id="ventaObservaciones" type="text" maxlength="1000" placeholder="Observaciones de la venta"></div>
            <div class="ventas-campo"><label for="ventaProducto">Producto</label><select id="ventaProducto"></select></div>
            <div class="ventas-campo"><label for="ventaCantidad">Cantidad</label><input id="ventaCantidad" type="number" min="1" step="1" value="1"></div>
          </div>
          <p id="ventaDisponibilidad" class="productos-contador"></p>
          <div class="ventas-acciones">
            <button type="button" id="ventaAgregar">Agregar producto</button>
            <button type="button" id="ventaLimpiar">Limpiar lista</button>
          </div>
          <p id="ventaMensaje" aria-live="polite"></p>
          <div class="tabla-contenedor"><table>
            <thead><tr><th>Producto</th><th>Cantidad</th><th>Precio de venta</th><th>Subtotal</th><th>Acción</th></tr></thead>
            <tbody id="ventaDetalles"></tbody>
          </table></div>
          <p class="ventas-total" id="ventaTotal">Total: Bs 0.00</p>
          <div class="ventas-acciones">
            <button type="button" id="ventaGuardar">Guardar borrador</button>
            <button type="button" id="ventaConfirmar" disabled>Confirmar venta</button>
          </div>
          <p id="ventaPendiente" aria-live="polite">No hay una venta seleccionada para confirmar.</p>
        </section>
        <section class="ventas-seccion ventas-historial">
          <h3>Historial de ventas</h3>
          <p class="productos-contador">También puedes confirmar un borrador guardado anteriormente.</p>
          <div class="tabla-contenedor"><table>
            <thead><tr><th>N.º</th><th>Fecha</th><th>Cliente</th><th>Total</th><th>Estado</th><th>Acción</th></tr></thead>
            <tbody id="ventaHistorial"></tbody>
          </table></div>
        </section>`;

      const $ = id => document.getElementById(id);
      const selector = $("ventaProducto");
      const clienteSelect = $("ventaCliente");
      const cantidad = $("ventaCantidad");
      const mensaje = $("ventaMensaje");
      const cuerpo = $("ventaDetalles");
      const guardar = $("ventaGuardar");
      const confirmar = $("ventaConfirmar");
      const detalles = [];
      let idVentaGuardada = null;
      let ocupado = false;
      const clientePorId = new Map(clientes.map(c => [String(c.id_cliente), c.nombre]));

      clienteSelect.add(new Option("Selecciona un cliente", ""));
      clientes.forEach(c => clienteSelect.add(new Option(c.nombre, String(c.id_cliente))));
      selector.add(new Option("Selecciona un producto", ""));
      productos.forEach(p => selector.add(new Option(p.nombre, String(p.id_producto))));

      function actualizarDisponibilidad() {
        const p = productos.find(item => String(item.id_producto) === selector.value);
        $("ventaDisponibilidad").textContent = p
          ? "Precio: " + formatoBs(p.precio_venta) + " · Stock disponible: " + p.stock_actual
          : "Selecciona un producto para ver su precio y stock.";
      }
      selector.addEventListener("change", actualizarDisponibilidad);
      actualizarDisponibilidad();

      function actualizarBotones() {
        guardar.disabled = ocupado || idVentaGuardada !== null || !productos.length || !clientes.length;
        confirmar.disabled = ocupado || idVentaGuardada === null;
        $("ventaAgregar").disabled = ocupado || idVentaGuardada !== null;
        $("ventaLimpiar").disabled = ocupado || idVentaGuardada !== null;
        clienteSelect.disabled = ocupado || idVentaGuardada !== null;
        $("ventaObservaciones").disabled = ocupado || idVentaGuardada !== null;
        $("ventaPendiente").textContent = idVentaGuardada === null
          ? "No hay una venta seleccionada para confirmar."
          : "Venta N.º " + idVentaGuardada + " en BORRADOR, pendiente de confirmación.";
      }

      function dibujarDetalles() {
        cuerpo.replaceChildren();
        if (!detalles.length) {
          const td = cuerpo.insertRow().insertCell();
          td.colSpan = 5;
          td.textContent = "Todavía no agregaste productos.";
        }
        detalles.forEach((item, indice) => {
          const fila = cuerpo.insertRow();
          [item.nombre, item.cantidad, formatoBs(item.precio), formatoBs(item.cantidad * item.precio)]
            .forEach(valor => { fila.insertCell().textContent = valor; });
          const boton = document.createElement("button");
          boton.type = "button";
          boton.className = "ventas-quitar";
          boton.textContent = "Quitar";
          boton.disabled = ocupado || idVentaGuardada !== null;
          boton.addEventListener("click", () => {
            detalles.splice(indice, 1);
            dibujarDetalles();
          });
          fila.insertCell().appendChild(boton);
        });
        const total = detalles.reduce((s, d) => s + d.cantidad * d.precio, 0);
        $("ventaTotal").textContent = "Total estimado: " + formatoBs(total);
      }

      function dibujarHistorial() {
        const tabla = $("ventaHistorial");
        tabla.replaceChildren();
        if (!ventas.length) {
          const td = tabla.insertRow().insertCell();
          td.colSpan = 6;
          td.textContent = "Todavía no hay ventas registradas.";
        }
        ventas.forEach(v => {
          const fila = tabla.insertRow();
          const fecha = v.fecha_venta ? new Date(v.fecha_venta).toLocaleString("es-BO") : "—";
          [v.id_venta, fecha, clientePorId.get(String(v.id_cliente)) || "Cliente no disponible", formatoBs(v.total_venta), v.estado]
            .forEach(valor => { fila.insertCell().textContent = valor; });
          const accion = fila.insertCell();
          if (v.estado === "BORRADOR") {
            const boton = document.createElement("button");
            boton.type = "button";
            boton.textContent = "Seleccionar";
            boton.disabled = ocupado;
            boton.addEventListener("click", () => {
              if (ocupado) return;
              idVentaGuardada = Number(v.id_venta);
              detalles.length = 0;
              dibujarDetalles();
              actualizarBotones();
              mensaje.textContent = "Seleccionaste la venta N.º " + idVentaGuardada + ". Revisa el historial antes de confirmar.";
              window.scrollTo({ top: 0, behavior: "smooth" });
            });
            accion.appendChild(boton);
          } else {
            accion.textContent = "—";
          }
        });
      }

      $("ventaAgregar").addEventListener("click", () => {
        if (ocupado || idVentaGuardada !== null) return;
        const p = productos.find(item => String(item.id_producto) === selector.value);
        const n = Number(cantidad.value);
        if (!p || !Number.isSafeInteger(n) || n <= 0) {
          mensaje.textContent = "Selecciona un producto y una cantidad entera positiva.";
          return;
        }
        if (Number(p.stock_actual) < n) {
          mensaje.textContent = "Stock insuficiente para " + p.nombre + ".";
          return;
        }
        if (detalles.some(d => d.id_producto === p.id_producto)) {
          mensaje.textContent = "El producto ya está agregado. Quítalo para cambiar la cantidad.";
          return;
        }
        if (!Number.isFinite(Number(p.precio_venta)) || Number(p.precio_venta) < 0) {
          mensaje.textContent = "Este producto no tiene un precio de venta válido.";
          return;
        }
        detalles.push({ id_producto: p.id_producto, nombre: p.nombre, cantidad: n, precio: Number(p.precio_venta) });
        mensaje.textContent = "Producto agregado.";
        dibujarDetalles();
      });

      $("ventaLimpiar").addEventListener("click", () => {
        if (ocupado || idVentaGuardada !== null) return;
        detalles.length = 0;
        mensaje.textContent = "Lista vaciada.";
        dibujarDetalles();
      });

      guardar.addEventListener("click", async () => {
        if (ocupado || idVentaGuardada !== null) return;
        const idCliente = Number(clienteSelect.value);
        if (!Number.isSafeInteger(idCliente) || idCliente <= 0) {
          mensaje.textContent = "Selecciona un cliente.";
          return;
        }
        if (!detalles.length) {
          mensaje.textContent = "Agrega al menos un producto.";
          return;
        }
        ocupado = true;
        actualizarBotones();
        guardar.textContent = "Guardando...";
        mensaje.textContent = "Guardando borrador...";
        try {
          const respuesta = await fetch(API + "/api/ventas", {
            method: "POST",
            headers: { "Content-Type": "application/json", Authorization: "Bearer " + tokenAcceso },
            body: JSON.stringify({
              id_cliente: idCliente,
              observaciones: $("ventaObservaciones").value.trim() || null,
              productos: detalles.map(d => ({ id_producto: d.id_producto, cantidad: d.cantidad }))
            })
          });
          const resultado = await respuesta.json().catch(() => ({}));
          if (respuesta.status === 401) {
            verLogin();
            throw new Error("La sesión ha expirado.");
          }
          if (!respuesta.ok) throw new Error(resultado.error || "No se pudo guardar la venta.");
          if (vista !== vistaActual) return;
          const id = Number(resultado.id_venta);
          if (!Number.isSafeInteger(id) || id <= 0) {
            throw new Error("El servidor respondió sin número de venta. Consulta el historial antes de intentar guardar otra vez.");
          }
          idVentaGuardada = id;
          ventas.unshift({
            id_venta: id, id_cliente: idCliente, fecha_venta: new Date().toISOString(),
            total_venta: detalles.reduce((s, d) => s + d.cantidad * d.precio, 0), estado: "BORRADOR"
          });
          mensaje.textContent = "Venta N.º " + id + " guardada como BORRADOR. El stock no se modificó.";
          dibujarHistorial();
        } catch (error) {
          if (vista === vistaActual) mensaje.textContent = "Error: " + error.message;
        } finally {
          ocupado = false;
          if (vista === vistaActual) {
            guardar.textContent = "Guardar borrador";
            actualizarBotones();
            dibujarDetalles();
          }
        }
      });

      confirmar.addEventListener("click", async () => {
        if (ocupado || idVentaGuardada === null) return;
        const id = idVentaGuardada;
        const aceptado = window.confirm(
          "¿Confirmar la venta N.º " + id + "?\n\nSe descontará el stock y se registrará una SALIDA en inventario. Esta operación no se puede repetir."
        );
        if (!aceptado) return;
        ocupado = true;
        actualizarBotones();
        confirmar.textContent = "Confirmando...";
        mensaje.textContent = "Confirmando venta N.º " + id + "...";
        try {
          const respuesta = await fetch(API + "/api/ventas/" + encodeURIComponent(id) + "/confirmar", {
            method: "POST", headers: { Authorization: "Bearer " + tokenAcceso }
          });
          const resultado = await respuesta.json().catch(() => ({}));
          if (respuesta.status === 401) {
            verLogin();
            throw new Error("La sesión ha expirado.");
          }
          if (!respuesta.ok) throw new Error(resultado.error || "No se pudo confirmar la venta.");
          if (vista !== vistaActual) return;
          idVentaGuardada = null;
          const venta = ventas.find(v => Number(v.id_venta) === id);
          if (venta) venta.estado = "CONFIRMADA";
          detalles.length = 0;
          mensaje.textContent = "Venta N.º " + id + " confirmada. El inventario fue actualizado.";
          dibujarHistorial();
          dibujarDetalles();
          // Actualizar stock mostrado en el selector para una venta posterior.
          try {
            productos = await obtenerProductos();
            if (vista === vistaActual) {
              selector.replaceChildren(new Option("Selecciona un producto", ""));
              productos.forEach(p => selector.add(new Option(p.nombre, String(p.id_producto))));
              actualizarDisponibilidad();
            }
          } catch (error) {
            if (vista === vistaActual) mensaje.textContent += " Recarga Ventas para consultar el stock actualizado.";
          }
        } catch (error) {
          if (vista === vistaActual) mensaje.textContent = "Error: " + error.message + " Si la conexión falló, revisa el historial antes de reintentar.";
        } finally {
          ocupado = false;
          if (vista === vistaActual) {
            confirmar.textContent = "Confirmar venta";
            actualizarBotones();
          }
        }
      });

      dibujarDetalles();
      dibujarHistorial();
      actualizarBotones();
      if (!clientes.length || !productos.length) {
        mensaje.textContent = "Necesitas al menos un cliente activo y un producto para registrar ventas.";
      }
    }

    function destruirVisor3D() {
      if (window.DrJiba3D) {
        window.DrJiba3D.destruir();
      }
    }

    function estadoStock(stock) {
      const cantidad = Number(stock || 0);
      if (cantidad <= 0) return "agotado";
      if (cantidad <= STOCK_BAJO) return "bajo";
      return "disponible";
    }

    const TEXTO_ESTADO = {
      agotado: "Agotado",
      bajo: "Stock bajo",
      disponible: "Disponible"
    };

    function formatoBs(valor) {
      return "Bs " + Number(valor || 0).toFixed(2);
    }

    function normalizarTexto(texto) {
      return String(texto ?? "")
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "");
    }

    function crearTarjetaResumen(tituloTarjeta, valor) {
      const tarjeta = document.createElement("div");
      tarjeta.className = "card";

      const h3 = document.createElement("h3");
      h3.textContent = tituloTarjeta;

      const p = document.createElement("p");
      p.textContent = valor;

      tarjeta.append(h3, p);
      return tarjeta;
    }

    const ORDENES = {
      "id": (a, b) => Number(a.id_producto) - Number(b.id_producto),
      "nombre": (a, b) =>
        String(a.nombre ?? "").localeCompare(String(b.nombre ?? ""), "es"),
      "precio-asc": (a, b) =>
        Number(a.precio_venta) - Number(b.precio_venta),
      "precio-desc": (a, b) =>
        Number(b.precio_venta) - Number(a.precio_venta),
      "stock-asc": (a, b) =>
        Number(a.stock_actual) - Number(b.stock_actual),
      "stock-desc": (a, b) =>
        Number(b.stock_actual) - Number(a.stock_actual)
    };

    function montarVisor3D(contenedor, vista, alMontar) {
      function intentar() {
        if (vista !== vistaActual || !contenedor.isConnected) return;

        if (window.DrJiba3D.montar(contenedor)) {
          alMontar();
        }
      }

      if (window.DrJiba3D) {
        intentar();
        return;
      }

      function fallo() {
        if (vista !== vistaActual || !contenedor.isConnected) return;
        contenedor.innerHTML =
          '<p class="visor3d-fallback">No se pudo cargar la vitrina 3D. Revisa tu conexión a internet.</p>';
      }

      if (window.DrJiba3DError) {
        fallo();
        return;
      }

      contenedor.innerHTML =
        '<p class="visor3d-fallback">Cargando vitrina 3D...</p>';

      window.addEventListener("drjiba3d:listo", intentar, { once: true });
      window.addEventListener("drjiba3d:error", fallo, { once: true });
    }

    async function mostrarProductos(vista) {
      const descripcion = document.getElementById("descripcion");
      const contenido = document.getElementById("contenido");

      descripcion.textContent =
        "Catálogo de productos con vitrina 3D interactiva.";

      contenido.style.display = "block";
      contenido.innerHTML =
        '<p class="mensaje">Cargando productos...</p>';

      let productos;

      try {
        productos = await obtenerProductos();
      } catch (error) {
        console.error(error);
        if (vista !== vistaActual) return;
        contenido.innerHTML =
          '<p class="mensaje">Error al cargar los productos. Intenta nuevamente.</p>';
        return;
      }

      if (vista !== vistaActual) return;

      contenido.innerHTML = "";

      if (!Array.isArray(productos) || productos.length === 0) {
        contenido.textContent = "No hay productos registrados.";
        return;
      }

      productos = productos.map(producto => ({
        ...producto,
        estado: estadoStock(producto.stock_actual)
      }));

      // Tarjetas de resumen
      const unidades = productos.reduce(
        (total, p) => total + Number(p.stock_actual || 0), 0
      );
      const valorInventario = productos.reduce(
        (total, p) =>
          total + Number(p.precio_venta || 0) * Number(p.stock_actual || 0),
        0
      );
      const agotados =
        productos.filter(p => p.estado === "agotado").length;
      const bajos =
        productos.filter(p => p.estado === "bajo").length;

      const resumen = document.createElement("div");
      resumen.className = "cards resumen";
      resumen.append(
        crearTarjetaResumen("Productos", productos.length),
        crearTarjetaResumen("Unidades en stock", unidades),
        crearTarjetaResumen("Valor del inventario", formatoBs(valorInventario)),
        crearTarjetaResumen("Agotados / stock bajo", agotados + " / " + bajos)
      );

      // Herramientas: buscador y orden
      const layout = document.createElement("div");
      layout.className = "productos-layout";

      const lista = document.createElement("div");

      const herramientas = document.createElement("div");
      herramientas.className = "productos-herramientas";

      const buscador = document.createElement("input");
      buscador.type = "search";
      buscador.id = "buscarProducto";
      buscador.placeholder = "Buscar por nombre o ID...";
      buscador.setAttribute("aria-label", "Buscar producto");

      const orden = document.createElement("select");
      orden.id = "ordenProductos";
      orden.setAttribute("aria-label", "Ordenar productos");

      [
        ["id", "Ordenar por ID"],
        ["nombre", "Nombre (A-Z)"],
        ["precio-asc", "Precio: menor a mayor"],
        ["precio-desc", "Precio: mayor a menor"],
        ["stock-asc", "Stock: menor a mayor"],
        ["stock-desc", "Stock: mayor a menor"]
      ].forEach(([valor, texto]) => {
        const opcion = document.createElement("option");
        opcion.value = valor;
        opcion.textContent = texto;
        orden.appendChild(opcion);
      });

      herramientas.append(buscador, orden);

      // Tabla
      const contenedorTabla = document.createElement("div");
      contenedorTabla.className = "tabla-contenedor";

      const tabla = document.createElement("table");
      tabla.id = "tablaProductos";

      const encabezado = document.createElement("thead");
      const filaEncabezado = document.createElement("tr");

      ["ID", "Producto", "Precio de venta", "Stock actual", "Estado"]
        .forEach(nombre => {
          const th = document.createElement("th");
          th.textContent = nombre;
          filaEncabezado.appendChild(th);
        });

      encabezado.appendChild(filaEncabezado);
      tabla.appendChild(encabezado);

      const cuerpo = document.createElement("tbody");
      tabla.appendChild(cuerpo);
      contenedorTabla.appendChild(tabla);

      const contador = document.createElement("p");
      contador.className = "productos-contador";
      contador.setAttribute("aria-live", "polite");

      lista.append(herramientas, contenedorTabla, contador);

      // Visor 3D
      const panel = document.createElement("aside");
      panel.className = "visor3d-panel";

      const tituloVisor = document.createElement("h3");
      tituloVisor.textContent = "Vitrina 3D";

      const visor = document.createElement("div");
      visor.className = "visor3d";
      visor.id = "visor3d";

      const ayuda = document.createElement("p");
      ayuda.className = "visor3d-ayuda";
      ayuda.textContent =
        "Arrastra para rotar · Rueda o pellizco para zoom · Flechas ← → del teclado";

      panel.append(tituloVisor, visor, ayuda);
      layout.append(lista, panel);
      contenido.append(resumen, layout);

      let seleccionado = productos[0];

      function seleccionar(producto) {
        seleccionado = producto;

        cuerpo.querySelectorAll("tr[data-id]").forEach(fila => {
          const activo = fila.dataset.id === String(producto.id_producto);
          fila.classList.toggle("seleccionado", activo);
          fila.setAttribute("aria-selected", activo ? "true" : "false");
        });

        if (window.DrJiba3D) {
          window.DrJiba3D.mostrarProducto(producto);
        }
      }

      function dibujarFilas() {
        const termino = normalizarTexto(buscador.value.trim());

        const visibles = productos
          .filter(p =>
            !termino ||
            normalizarTexto(p.nombre).includes(termino) ||
            String(p.id_producto).includes(termino)
          )
          .sort(ORDENES[orden.value]);

        cuerpo.innerHTML = "";

        if (visibles.length === 0) {
          const fila = document.createElement("tr");
          const celda = document.createElement("td");
          celda.colSpan = 5;
          celda.textContent = "No se encontraron productos.";
          fila.appendChild(celda);
          cuerpo.appendChild(fila);
        }

        visibles.forEach(producto => {
          const fila = document.createElement("tr");
          fila.dataset.id = producto.id_producto;
          fila.tabIndex = 0;

          [
            producto.id_producto,
            producto.nombre,
            formatoBs(producto.precio_venta),
            producto.stock_actual
          ].forEach((valor, indice) => {
            const celda = document.createElement("td");
            celda.textContent = valor;

            if (indice === 3 && producto.estado === "agotado") {
              celda.className = "stock-bajo";
            }

            fila.appendChild(celda);
          });

          const celdaEstado = document.createElement("td");
          const etiqueta = document.createElement("span");
          etiqueta.className = "etiqueta etiqueta-" + producto.estado;
          etiqueta.textContent = TEXTO_ESTADO[producto.estado];
          celdaEstado.appendChild(etiqueta);
          fila.appendChild(celdaEstado);

          fila.addEventListener("click", () => seleccionar(producto));
          fila.addEventListener("keydown", evento => {
            if (evento.key === "Enter" || evento.key === " ") {
              evento.preventDefault();
              seleccionar(producto);
            }
          });

          cuerpo.appendChild(fila);
        });

        contador.textContent =
          "Mostrando " + visibles.length + " de " + productos.length +
          " productos";

        if (seleccionado) {
          seleccionar(seleccionado);
        }
      }

      buscador.addEventListener("input", dibujarFilas);
      orden.addEventListener("change", dibujarFilas);

      dibujarFilas();

      montarVisor3D(visor, vista, () => {
        if (seleccionado) {
          window.DrJiba3D.mostrarProducto(seleccionado);
        }
      });
    }

    validarSesion();
  </script>

</body>
</html>
