
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DR. JIBA | Sistema de Gestión</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f4f6;
      color: #1f2937;
    }

    header {
      background: #7f1d1d;
      color: white;
      padding: 22px;
      text-align: center;
    }

    header h1 { margin: 0 0 8px; }

    nav {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px;
      background: #991b1b;
      padding: 14px;
    }

    nav button, .boton {
      background: white;
      border: none;
      border-radius: 6px;
      padding: 12px 18px;
      cursor: pointer;
      font-weight: bold;
      color: #7f1d1d;
    }

    nav button:hover { background: #fee2e2; }

    main {
      max-width: 1100px;
      margin: 30px auto;
      padding: 0 20px;
    }

    .panel {
      background: white;
      border-radius: 12px;
      padding: 25px;
      box-shadow: 0 2px 8px #00000012;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 18px;
      margin-top: 20px;
    }

    .card {
      padding: 25px;
      background: #fef2f2;
      border-left: 5px solid #991b1b;
      border-radius: 8px;
    }

    .card h3 { margin-top: 0; }

    .card p {
      font-size: 25px;
      font-weight: bold;
      margin-bottom: 0;
    }

    .tabla-contenedor {
      width: 100%;
      overflow-x: auto;
      margin-top: 20px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th {
      background: #991b1b;
      color: white;
      text-align: left;
      padding: 14px;
    }

    td {
      padding: 13px;
      border-bottom: 1px solid #e5e7eb;
    }

    tr:nth-child(even) { background: #f9fafb; }

    .stock-bajo {
      color: #b91c1c;
      font-weight: bold;
    }

    .mensaje {
      padding: 15px;
      border-radius: 8px;
      background: #fef2f2;
      margin-top: 15px;
    }

    .login {
      max-width: 420px;
      margin: 45px auto;
    }

    .login h2 {
      text-align: center;
      color: #7f1d1d;
    }

    .login label {
      display: block;
      margin-top: 18px;
      font-weight: bold;
    }

    .login input {
      width: 100%;
      padding: 12px;
      margin-top: 7px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      font-size: 15px;
    }

    .login button {
      width: 100%;
      background: #991b1b;
      color: white;
      padding: 13px;
      margin-top: 22px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }

    .login button:disabled {
      opacity: .6;
      cursor: wait;
    }

    .error {
      color: #b91c1c;
      margin-top: 15px;
      text-align: center;
    }

    .usuario {
      background: #fff7f7;
      padding: 12px 18px;
      border-radius: 8px;
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    .usuario button {
      background: #991b1b;
      color: white;
      border: none;
      padding: 10px 14px;
      border-radius: 6px;
      cursor: pointer;
    }

    .resumen {
      margin-top: 0;
      margin-bottom: 22px;
    }

    .resumen .card p { font-size: 22px; }

    .productos-layout {
      display: grid;
      grid-template-columns: minmax(0, 3fr) minmax(280px, 2fr);
      gap: 22px;
      align-items: start;
    }

    .productos-layout > * { min-width: 0; }

    .productos-herramientas {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .productos-herramientas input,
    .productos-herramientas select {
      padding: 10px 12px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      font-size: 15px;
      background: white;
    }

    .productos-herramientas input { flex: 1 1 200px; }

    .productos-contador {
      color: #6b7280;
      font-size: 14px;
      margin: 10px 0 0;
    }

    #tablaProductos tbody tr[data-id] { cursor: pointer; }

    #tablaProductos tbody tr[data-id]:hover,
    #tablaProductos tbody tr[data-id]:focus {
      background: #fee2e2;
      outline: none;
    }

    #tablaProductos tbody tr.seleccionado {
      background: #fecaca;
      box-shadow: inset 4px 0 0 #991b1b;
    }

    .etiqueta {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: bold;
      white-space: nowrap;
    }

    .etiqueta-agotado { background: #fee2e2; color: #b91c1c; }
    .etiqueta-bajo { background: #fef3c7; color: #b45309; }
    .etiqueta-disponible { background: #dcfce7; color: #15803d; }

    .visor3d-panel {
      background: linear-gradient(180deg, #fff7f7, #fde8e8);
      border: 1px solid #fecaca;
      border-radius: 12px;
      padding: 16px;
      position: sticky;
      top: 20px;
    }

    .visor3d-panel h3 {
      margin: 0 0 10px;
      color: #7f1d1d;
    }

    .visor3d {
      width: 100%;
      height: 340px;
      border-radius: 10px;
      overflow: hidden;
      background: radial-gradient(circle at 50% 35%, #ffffff, #fde2e2);
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: none;
    }

    .visor3d canvas {
      display: block;
      width: 100%;
      height: 100%;
      cursor: grab;
    }

    .visor3d canvas:active { cursor: grabbing; }

    .visor3d canvas:focus-visible { outline: 3px solid #991b1b; }

    .visor3d-fallback {
      padding: 20px;
      text-align: center;
      color: #6b7280;
    }

    .visor3d-ayuda {
      font-size: 13px;
      color: #6b7280;
      margin: 10px 0 0;
      text-align: center;
    }

    @media (max-width: 820px) {
      .productos-layout { grid-template-columns: minmax(0, 1fr); }
      .visor3d-panel { position: static; order: -1; }
      .visor3d { height: 280px; }
    }


    /* Modulo de compras */
    .compras-formulario { display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:14px; margin:18px 0; }
    .compras-campo label { display:block; font-weight:bold; margin-bottom:7px; }
    .compras-campo input, .compras-campo select { width:100%; padding:11px; border:1px solid #d1d5db; border-radius:6px; background:white; }
    .compras-acciones { display:flex; gap:10px; flex-wrap:wrap; margin:16px 0; }
    .compras-acciones button { border:0; border-radius:6px; padding:12px 16px; background:#991b1b; color:white; font-weight:bold; cursor:pointer; }
    .compras-acciones button:disabled { opacity:.5; cursor:not-allowed; }
    .compras-total { text-align:right; font-size:22px; font-weight:bold; color:#7f1d1d; }
    .compras-aviso { padding:12px; background:#fff7ed; border-left:4px solid #d97706; border-radius:6px; margin:15px 0; }

    footer {
      text-align: center;
      padding: 25px;
      color: #6b7280;
    }

    [hidden] { display: none !important; }
  </style>
</head>

<body>

  <header>
    <h1>DR. JIBA</h1>
    <p>Sistema de Compras, Ventas e Inventario</p>
  </header>

  <nav id="menu" hidden>
    <button onclick="mostrar('Inicio')">Inicio</button>
    <button onclick="mostrar('Productos')">Productos</button>
    <button onclick="mostrar('Compras')">Compras</button>
    <button onclick="mostrar('Ventas')">Ventas</button>
    <button onclick="mostrar('Inventario')">Inventario</button>
  </nav>

  <main>

    <section id="seccionLogin" class="panel login">
      <h2>Iniciar sesión</h2>
      <p style="text-align:center">
        Acceso al sistema administrativo DR. JIBA
      </p>

      <form id="formLogin">
        <label for="correo">Correo electrónico</label>
        <input
          type="email"
          id="correo"
          placeholder="administrador@correo.com"
          autocomplete="username"
          required
        >

        <label for="contrasena">Contraseña</label>
        <input
          type="password"
          id="contrasena"
          placeholder="Ingresa tu contraseña"
          autocomplete="current-password"
          required
        >

        <button type="submit" id="btnIngresar">
          Ingresar al sistema
        </button>
      </form>

      <p id="errorLogin" class="error" role="alert"></p>
    </section>

    <section id="seccionSistema" hidden>

      <div class="usuario">
        <span id="datosUsuario">Administrador DR. JIBA</span>
        <button onclick="cerrarSesion()">Cerrar sesión</button>
      </div>

      <section class="panel">
        <h2 id="titulo">Panel Principal</h2>

        <p id="descripcion">
          Bienvenido al sistema de gestión del restaurante DR. JIBA.
        </p>

        <div class="cards" id="contenido"></div>
      </section>

    </section>

  </main>

  <footer>
    DR. JIBA - Sistema de Gestión
  </footer>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
      }
    }
  </script>

  <script
    type="module"
    src="js/productos3d.js"
    onerror="window.DrJiba3DError = true; window.dispatchEvent(new Event('drjiba3d:error'));"
  ></script>

  <script>
    const API = "";

    let tokenAcceso = sessionStorage.getItem("drjiba_token");
    let sesionActual = 0;
    let vistaActual = 0;

    const STOCK_BAJO = 5;

    const login = document.getElementById("seccionLogin");
    const sistema = document.getElementById("seccionSistema");
    const menu = document.getElementById("menu");

    function verLogin() {
      sesionActual++;
      vistaActual++;
      destruirVisor3D();
      tokenAcceso = null;
      sessionStorage.removeItem("drjiba_token");
      login.hidden = false;
      sistema.hidden = true;
      menu.hidden = true;
      document.getElementById("contrasena").value = "";
    }

    function verSistema() {
      login.hidden = true;
      sistema.hidden = false;
      menu.hidden = false;
      mostrar("Inicio");
    }

    async function peticionProtegida(ruta) {
      if (!tokenAcceso) {
        throw new Error("Debes iniciar sesión");
      }

      const respuesta = await fetch(API + ruta, {
        headers: {
          Authorization: "Bearer " + tokenAcceso
        }
      });

      if (respuesta.status === 401) {
        verLogin();
        throw new Error("La sesión ha expirado");
      }

      if (!respuesta.ok) {
        throw new Error("Error al consultar el servidor");
      }

      return await respuesta.json();
    }

    async function validarSesion() {
      if (!tokenAcceso) {
        verLogin();
        return;
      }

      const intento = ++sesionActual;

      try {
        const perfil = await peticionProtegida("/api/mi-perfil");

        if (intento !== sesionActual) return;

        if (!perfil || perfil.activo === false) {
          throw new Error("Usuario inactivo");
        }

        const nombre = perfil.nombre_completo || "Usuario";
        const rol = perfil.rol || "Sin rol";

        document.getElementById("datosUsuario").textContent =
          nombre + " | " + rol;

        verSistema();

      } catch (error) {
        if (intento !== sesionActual) return;
        console.error("No se pudo validar la sesión:", error.message);
        verLogin();
      }
    }

    document.getElementById("formLogin").addEventListener(
      "submit",
      async function(evento) {
        evento.preventDefault();

        const correo = document.getElementById("correo").value.trim();
        const contrasena = document.getElementById("contrasena").value;
        const errorLogin = document.getElementById("errorLogin");
        const boton = document.getElementById("btnIngresar");

        errorLogin.textContent = "";
        boton.disabled = true;
        boton.textContent = "Ingresando...";

        try {
          const respuesta = await fetch(API + "/api/login", {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              email: correo,
              password: contrasena
            })
          });

          const resultado = await respuesta.json();

          if (!respuesta.ok) {
            throw new Error(
              resultado.error || "No se pudo iniciar sesión"
            );
          }

          const token =
            resultado.access_token ||
            resultado.session?.access_token;

          if (!token) {
            throw new Error("El servidor no devolvió un token");
          }

          tokenAcceso = token;
          sessionStorage.setItem("drjiba_token", token);

          await validarSesion();

          if (!tokenAcceso) {
            errorLogin.textContent =
              "No se pudo validar tu perfil. Revisa los permisos.";
          }

        } catch (error) {
          errorLogin.textContent = error.message;
        } finally {
          boton.disabled = false;
          boton.textContent = "Ingresar al sistema";
        }
      }
    );

    function cerrarSesion() {
      verLogin();
      document.getElementById("errorLogin").textContent = "";
    }

    async function obtenerProductos() {
      return await peticionProtegida("/api/productos");
    }

    async function mostrar(modulo) {
      if (!tokenAcceso) {
        verLogin();
        return;
      }

      vistaActual++;
      destruirVisor3D();

      const titulo = document.getElementById("titulo");
      const descripcion = document.getElementById("descripcion");
      const contenido = document.getElementById("contenido");

      titulo.textContent =
        modulo === "Inicio" ? "Panel Principal" : modulo;

      if (modulo === "Inicio") {
        descripcion.textContent =
          "Bienvenido al sistema de gestión del restaurante DR. JIBA.";

        contenido.style.display = "grid";

        contenido.innerHTML = `
          <div class="card">
            <h3>Productos</h3>
            <p id="totalProductos">—</p>
          </div>
          <div class="card">
            <h3>Compras</h3>
            <p>—</p>
          </div>
          <div class="card">
            <h3>Ventas</h3>
            <p>—</p>
          </div>
          <div class="card">
            <h3>Unidades en stock</h3>
            <p id="totalStock">—</p>
          </div>
        `;

        try {
          const productos = await obtenerProductos();

          const stockTotal = productos.reduce(
            (total, producto) =>
              total + Number(producto.stock_actual || 0),
            0
          );

          const totalProductos =
            document.getElementById("totalProductos");
          const totalStock =
            document.getElementById("totalStock");

          if (totalProductos) {
            totalProductos.textContent = productos.length;
          }

          if (totalStock) {
            totalStock.textContent = stockTotal;
          }
        } catch (error) {
          console.error(error);
        }

        return;
      }

      if (modulo === "Productos") {
        await mostrarProductos(vistaActual);
        return;
      }

      if (modulo === "Compras") {
        await mostrarCompras(vistaActual);
        return;
      }

      if (modulo === "Inventario") {
        descripcion.textContent =
          "Información actualizada desde Supabase.";

        contenido.style.display = "block";
        contenido.innerHTML =
          '<p class="mensaje">Cargando productos...</p>';

        try {
          const productos = await obtenerProductos();

          contenido.innerHTML = "";

          if (productos.length === 0) {
            contenido.textContent =
              "No hay productos registrados.";
            return;
          }

          const contenedor = document.createElement("div");
          contenedor.className = "tabla-contenedor";

          const tabla = document.createElement("table");
          const encabezado = document.createElement("thead");
          const filaEncabezado = document.createElement("tr");

          [
            "ID",
            "Producto",
            "Precio de venta",
            "Stock actual"
          ].forEach(nombre => {
            const th = document.createElement("th");
            th.textContent = nombre;
            filaEncabezado.appendChild(th);
          });

          encabezado.appendChild(filaEncabezado);
          tabla.appendChild(encabezado);

          const cuerpo = document.createElement("tbody");

          productos.forEach(producto => {
            const fila = document.createElement("tr");

            [
              producto.id_producto,
              producto.nombre,
              "Bs " + Number(producto.precio_venta).toFixed(2),
              producto.stock_actual
            ].forEach((valor, indice) => {
              const celda = document.createElement("td");
              celda.textContent = valor;

              if (
                indice === 3 &&
                Number(producto.stock_actual) === 0
              ) {
                celda.className = "stock-bajo";
              }

              fila.appendChild(celda);
            });

            cuerpo.appendChild(fila);
          });

          tabla.appendChild(cuerpo);
          contenedor.appendChild(tabla);
          contenido.appendChild(contenedor);

        } catch (error) {
          console.error(error);
          contenido.innerHTML =
            '<p class="mensaje">Error al cargar los productos. Intenta nuevamente.</p>';
        }

        return;
      }

      descripcion.textContent =
        "Módulo de " + modulo + " en preparación.";

      contenido.style.display = "none";
    }


    // ========================================
    // MODULO DE COMPRAS
    // ========================================
    async function mostrarCompras(vista) {
      const descripcion = document.getElementById("descripcion");
      const contenido = document.getElementById("contenido");
      descripcion.textContent = "Registra una compra en borrador sin modificar el inventario.";
      contenido.style.display = "block";
      contenido.innerHTML = '<p class="mensaje">Cargando productos y proveedores...</p>';

      let productos, proveedores;
      try {
        [productos, proveedores] = await Promise.all([
          obtenerProductos(),
          peticionProtegida("/api/proveedores")
        ]);
      } catch (error) {
        if (vista !== vistaActual) return;
        contenido.textContent = "No se pudieron cargar los datos de compras: " + error.message;
        return;
      }
      if (vista !== vistaActual) return;

      contenido.innerHTML = `
        <div class="compras-aviso" role="status">
          Guardar borrador registra la compra sin aumentar el stock. La confirmación se habilitará después de verificar sus permisos.
        </div>
        <h3>Nueva compra</h3>
        <div class="compras-formulario">
          <div class="compras-campo">
            <label for="compraProveedor">Proveedor</label>
            <select id="compraProveedor"></select>
          </div>
          <div class="compras-campo">
            <label for="compraObservaciones">Observaciones (opcional)</label>
            <input id="compraObservaciones" type="text" maxlength="500" placeholder="Detalle de la compra">
          </div>
          <div class="compras-campo">
            <label for="compraProducto">Producto</label>
            <select id="compraProducto"></select>
          </div>
          <div class="compras-campo">
            <label for="compraCantidad">Cantidad</label>
            <input id="compraCantidad" type="number" min="1" step="1" value="1">
          </div>
          <div class="compras-campo">
            <label for="compraPrecio">Precio de compra (Bs)</label>
            <input id="compraPrecio" type="number" min="0" step="0.01" placeholder="0.00">
          </div>
        </div>
        <div class="compras-acciones">
          <button type="button" id="agregarDetalleCompra">Agregar producto</button>
          <button type="button" id="limpiarDetalleCompra">Limpiar lista</button>
        </div>
        <p id="mensajeCompra" aria-live="polite"></p>
        <div class="tabla-contenedor">
          <table>
            <thead><tr><th>Producto</th><th>Cantidad</th><th>Precio unitario</th><th>Subtotal</th><th>Acción</th></tr></thead>
            <tbody id="detallesCompra"><tr><td colspan="5">Todavía no agregaste productos.</td></tr></tbody>
          </table>
        </div>
        <p class="compras-total" id="totalCompra">Total: Bs 0.00</p>
        <div class="compras-acciones">
          <button type="button" id="guardarBorradorCompra">Guardar borrador</button>
          <button type="button" disabled title="Pendiente de revisión de permisos">Confirmar compra (próximamente)</button>
        </div>`;

      const selector = document.getElementById("compraProducto");
      const proveedorSelect = document.getElementById("compraProveedor");
      const cantidad = document.getElementById("compraCantidad");
      const precio = document.getElementById("compraPrecio");
      const mensaje = document.getElementById("mensajeCompra");
      const cuerpo = document.getElementById("detallesCompra");
      const guardar = document.getElementById("guardarBorradorCompra");
      const detalles = [];
      let guardando = false;

      proveedorSelect.add(new Option("Selecciona un proveedor", ""));
      proveedores.filter(p => p.activo !== false).forEach(p => {
        proveedorSelect.add(new Option(p.nombre, String(p.id_proveedor)));
      });
      productos.forEach(p => selector.add(new Option(p.nombre, String(p.id_producto))));
      if (!productos.length || proveedores.filter(p => p.activo !== false).length === 0) {
        guardar.disabled = true;
        mensaje.textContent = "Necesitas al menos un producto y un proveedor activo.";
      }

      function dibujarDetalles() {
        cuerpo.replaceChildren();
        if (!detalles.length) {
          const celda = cuerpo.insertRow().insertCell();
          celda.colSpan = 5;
          celda.textContent = "Todavía no agregaste productos.";
        }
        detalles.forEach((item, indice) => {
          const fila = cuerpo.insertRow();
          [item.nombre, item.cantidad, formatoBs(item.precio), formatoBs(item.cantidad * item.precio)]
            .forEach(valor => { fila.insertCell().textContent = valor; });
          const boton = document.createElement("button");
          boton.type = "button";
          boton.textContent = "Quitar";
          boton.disabled = guardando;
          boton.addEventListener("click", () => {
            detalles.splice(indice, 1);
            dibujarDetalles();
          });
          fila.insertCell().appendChild(boton);
        });
        const total = detalles.reduce((suma, item) => suma + item.cantidad * item.precio, 0);
        document.getElementById("totalCompra").textContent = "Total: " + formatoBs(total);
      }

      document.getElementById("agregarDetalleCompra").addEventListener("click", () => {
        if (guardando) return;
        const producto = productos.find(p => String(p.id_producto) === selector.value);
        const unidades = Number(cantidad.value);
        const costo = Number(precio.value);
        if (!producto || !Number.isSafeInteger(unidades) || unidades <= 0 ||
            precio.value.trim() === "" || !Number.isFinite(costo) || costo < 0 ||
            !Number.isInteger(Math.round(costo * 100))) {
          mensaje.textContent = "Selecciona un producto, una cantidad entera positiva y un precio válido.";
          return;
        }
        if (detalles.some(d => d.id_producto === producto.id_producto)) {
          mensaje.textContent = "Ese producto ya está agregado. Quítalo para cambiar su cantidad.";
          return;
        }
        detalles.push({ id_producto: producto.id_producto, nombre: producto.nombre, cantidad: unidades, precio: costo });
        mensaje.textContent = "Producto agregado a la lista.";
        dibujarDetalles();
      });

      document.getElementById("limpiarDetalleCompra").addEventListener("click", () => {
        if (guardando) return;
        detalles.length = 0;
        mensaje.textContent = "Lista vaciada.";
        dibujarDetalles();
      });

      guardar.addEventListener("click", async () => {
        if (guardando) return;
        const idProveedor = Number(proveedorSelect.value);
        if (!Number.isSafeInteger(idProveedor) || idProveedor <= 0) {
          mensaje.textContent = "Selecciona un proveedor.";
          return;
        }
        if (!detalles.length) {
          mensaje.textContent = "Agrega al menos un producto.";
          return;
        }
        guardando = true;
        guardar.disabled = true;
        guardar.textContent = "Guardando...";
        mensaje.textContent = "Registrando borrador...";
        dibujarDetalles();
        try {
          const respuesta = await fetch(API + "/api/compras", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              Authorization: "Bearer " + tokenAcceso
            },
            body: JSON.stringify({
              id_proveedor: idProveedor,
              observaciones: document.getElementById("compraObservaciones").value.trim() || null,
              productos: detalles.map(d => ({
                id_producto: d.id_producto,
                cantidad: d.cantidad,
                precio_unitario: d.precio
              }))
            })
          });
          const resultado = await respuesta.json().catch(() => ({}));
          if (respuesta.status === 401) {
            verLogin();
            throw new Error("La sesión ha expirado.");
          }
          if (!respuesta.ok) throw new Error(resultado.error || "No se pudo guardar la compra.");
          if (vista !== vistaActual) return;
          detalles.length = 0;
          dibujarDetalles();
          mensaje.textContent = "Borrador guardado correctamente. Compra N.º " + resultado.id_compra + ". El inventario no se ha modificado.";
        } catch (error) {
          if (vista === vistaActual) mensaje.textContent = "Error: " + error.message;
        } finally {
          guardando = false;
          if (vista === vistaActual) {
            guardar.disabled = false;
            guardar.textContent = "Guardar borrador";
            dibujarDetalles();
          }
        }
      });
    }

    // ========================================
    // VISTA DE PRODUCTOS
    // ========================================

    function destruirVisor3D() {
      if (window.DrJiba3D) {
        window.DrJiba3D.destruir();
      }
    }

    function estadoStock(stock) {
      const cantidad = Number(stock || 0);
      if (cantidad <= 0) return "agotado";
      if (cantidad <= STOCK_BAJO) return "bajo";
      return "disponible";
    }

    const TEXTO_ESTADO = {
      agotado: "Agotado",
      bajo: "Stock bajo",
      disponible: "Disponible"
    };

    function formatoBs(valor) {
      return "Bs " + Number(valor || 0).toFixed(2);
    }

    function normalizarTexto(texto) {
      return String(texto ?? "")
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "");
    }

    function crearTarjetaResumen(tituloTarjeta, valor) {
      const tarjeta = document.createElement("div");
      tarjeta.className = "card";

      const h3 = document.createElement("h3");
      h3.textContent = tituloTarjeta;

      const p = document.createElement("p");
      p.textContent = valor;

      tarjeta.append(h3, p);
      return tarjeta;
    }

    const ORDENES = {
      "id": (a, b) => Number(a.id_producto) - Number(b.id_producto),
      "nombre": (a, b) =>
        String(a.nombre ?? "").localeCompare(String(b.nombre ?? ""), "es"),
      "precio-asc": (a, b) =>
        Number(a.precio_venta) - Number(b.precio_venta),
      "precio-desc": (a, b) =>
        Number(b.precio_venta) - Number(a.precio_venta),
      "stock-asc": (a, b) =>
        Number(a.stock_actual) - Number(b.stock_actual),
      "stock-desc": (a, b) =>
        Number(b.stock_actual) - Number(a.stock_actual)
    };

    function montarVisor3D(contenedor, vista, alMontar) {
      function intentar() {
        if (vista !== vistaActual || !contenedor.isConnected) return;

        if (window.DrJiba3D.montar(contenedor)) {
          alMontar();
        }
      }

      if (window.DrJiba3D) {
        intentar();
        return;
      }

      function fallo() {
        if (vista !== vistaActual || !contenedor.isConnected) return;
        contenedor.innerHTML =
          '<p class="visor3d-fallback">No se pudo cargar la vitrina 3D. Revisa tu conexión a internet.</p>';
      }

      if (window.DrJiba3DError) {
        fallo();
        return;
      }

      contenedor.innerHTML =
        '<p class="visor3d-fallback">Cargando vitrina 3D...</p>';

      window.addEventListener("drjiba3d:listo", intentar, { once: true });
      window.addEventListener("drjiba3d:error", fallo, { once: true });
    }

    async function mostrarProductos(vista) {
      const descripcion = document.getElementById("descripcion");
      const contenido = document.getElementById("contenido");

      descripcion.textContent =
        "Catálogo de productos con vitrina 3D interactiva.";

      contenido.style.display = "block";
      contenido.innerHTML =
        '<p class="mensaje">Cargando productos...</p>';

      let productos;

      try {
        productos = await obtenerProductos();
      } catch (error) {
        console.error(error);
        if (vista !== vistaActual) return;
        contenido.innerHTML =
          '<p class="mensaje">Error al cargar los productos. Intenta nuevamente.</p>';
        return;
      }

      if (vista !== vistaActual) return;

      contenido.innerHTML = "";

      if (!Array.isArray(productos) || productos.length === 0) {
        contenido.textContent = "No hay productos registrados.";
        return;
      }

      productos = productos.map(producto => ({
        ...producto,
        estado: estadoStock(producto.stock_actual)
      }));

      // Tarjetas de resumen
      const unidades = productos.reduce(
        (total, p) => total + Number(p.stock_actual || 0), 0
      );
      const valorInventario = productos.reduce(
        (total, p) =>
          total + Number(p.precio_venta || 0) * Number(p.stock_actual || 0),
        0
      );
      const agotados =
        productos.filter(p => p.estado === "agotado").length;
      const bajos =
        productos.filter(p => p.estado === "bajo").length;

      const resumen = document.createElement("div");
      resumen.className = "cards resumen";
      resumen.append(
        crearTarjetaResumen("Productos", productos.length),
        crearTarjetaResumen("Unidades en stock", unidades),
        crearTarjetaResumen("Valor del inventario", formatoBs(valorInventario)),
        crearTarjetaResumen("Agotados / stock bajo", agotados + " / " + bajos)
      );

      // Herramientas: buscador y orden
      const layout = document.createElement("div");
      layout.className = "productos-layout";

      const lista = document.createElement("div");

      const herramientas = document.createElement("div");
      herramientas.className = "productos-herramientas";

      const buscador = document.createElement("input");
      buscador.type = "search";
      buscador.id = "buscarProducto";
      buscador.placeholder = "Buscar por nombre o ID...";
      buscador.setAttribute("aria-label", "Buscar producto");

      const orden = document.createElement("select");
      orden.id = "ordenProductos";
      orden.setAttribute("aria-label", "Ordenar productos");

      [
        ["id", "Ordenar por ID"],
        ["nombre", "Nombre (A-Z)"],
        ["precio-asc", "Precio: menor a mayor"],
        ["precio-desc", "Precio: mayor a menor"],
        ["stock-asc", "Stock: menor a mayor"],
        ["stock-desc", "Stock: mayor a menor"]
      ].forEach(([valor, texto]) => {
        const opcion = document.createElement("option");
        opcion.value = valor;
        opcion.textContent = texto;
        orden.appendChild(opcion);
      });

      herramientas.append(buscador, orden);

      // Tabla
      const contenedorTabla = document.createElement("div");
      contenedorTabla.className = "tabla-contenedor";

      const tabla = document.createElement("table");
      tabla.id = "tablaProductos";

      const encabezado = document.createElement("thead");
      const filaEncabezado = document.createElement("tr");

      ["ID", "Producto", "Precio de venta", "Stock actual", "Estado"]
        .forEach(nombre => {
          const th = document.createElement("th");
          th.textContent = nombre;
          filaEncabezado.appendChild(th);
        });

      encabezado.appendChild(filaEncabezado);
      tabla.appendChild(encabezado);

      const cuerpo = document.createElement("tbody");
      tabla.appendChild(cuerpo);
      contenedorTabla.appendChild(tabla);

      const contador = document.createElement("p");
      contador.className = "productos-contador";
      contador.setAttribute("aria-live", "polite");

      lista.append(herramientas, contenedorTabla, contador);

      // Visor 3D
      const panel = document.createElement("aside");
      panel.className = "visor3d-panel";

      const tituloVisor = document.createElement("h3");
      tituloVisor.textContent = "Vitrina 3D";

      const visor = document.createElement("div");
      visor.className = "visor3d";
      visor.id = "visor3d";

      const ayuda = document.createElement("p");
      ayuda.className = "visor3d-ayuda";
      ayuda.textContent =
        "Arrastra para rotar · Rueda o pellizco para zoom · Flechas ← → del teclado";

      panel.append(tituloVisor, visor, ayuda);
      layout.append(lista, panel);
      contenido.append(resumen, layout);

      let seleccionado = productos[0];

      function seleccionar(producto) {
        seleccionado = producto;

        cuerpo.querySelectorAll("tr[data-id]").forEach(fila => {
          const activo = fila.dataset.id === String(producto.id_producto);
          fila.classList.toggle("seleccionado", activo);
          fila.setAttribute("aria-selected", activo ? "true" : "false");
        });

        if (window.DrJiba3D) {
          window.DrJiba3D.mostrarProducto(producto);
        }
      }

      function dibujarFilas() {
        const termino = normalizarTexto(buscador.value.trim());

        const visibles = productos
          .filter(p =>
            !termino ||
            normalizarTexto(p.nombre).includes(termino) ||
            String(p.id_producto).includes(termino)
          )
          .sort(ORDENES[orden.value]);

        cuerpo.innerHTML = "";

        if (visibles.length === 0) {
          const fila = document.createElement("tr");
          const celda = document.createElement("td");
          celda.colSpan = 5;
          celda.textContent = "No se encontraron productos.";
          fila.appendChild(celda);
          cuerpo.appendChild(fila);
        }

        visibles.forEach(producto => {
          const fila = document.createElement("tr");
          fila.dataset.id = producto.id_producto;
          fila.tabIndex = 0;

          [
            producto.id_producto,
            producto.nombre,
            formatoBs(producto.precio_venta),
            producto.stock_actual
          ].forEach((valor, indice) => {
            const celda = document.createElement("td");
            celda.textContent = valor;

            if (indice === 3 && producto.estado === "agotado") {
              celda.className = "stock-bajo";
            }

            fila.appendChild(celda);
          });

          const celdaEstado = document.createElement("td");
          const etiqueta = document.createElement("span");
          etiqueta.className = "etiqueta etiqueta-" + producto.estado;
          etiqueta.textContent = TEXTO_ESTADO[producto.estado];
          celdaEstado.appendChild(etiqueta);
          fila.appendChild(celdaEstado);

          fila.addEventListener("click", () => seleccionar(producto));
          fila.addEventListener("keydown", evento => {
            if (evento.key === "Enter" || evento.key === " ") {
              evento.preventDefault();
              seleccionar(producto);
            }
          });

          cuerpo.appendChild(fila);
        });

        contador.textContent =
          "Mostrando " + visibles.length + " de " + productos.length +
          " productos";

        if (seleccionado) {
          seleccionar(seleccionado);
        }
      }

      buscador.addEventListener("input", dibujarFilas);
      orden.addEventListener("change", dibujarFilas);

      dibujarFilas();

      montarVisor3D(visor, vista, () => {
        if (seleccionado) {
          window.DrJiba3D.mostrarProducto(seleccionado);
        }
      });
    }

    validarSesion();
  </script>

</body>
</html>
